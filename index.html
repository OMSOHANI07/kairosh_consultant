    <!-- Decide before first paint whether the animated-logo intro plays (once per session) -->
    <script>
      try {
        if (
          !sessionStorage.getItem('kc_intro') &&
          !location.pathname.startsWith('/admin') &&
          !window.matchMedia('(prefers-reduced-motion: reduce)').matches &&
          !/bot|crawl|spider|slurp|facebookexternalhit|whatsapp|preview/i.test(navigator.userAgent)
        )
          document.documentElement.dataset.intro = 'on'
      } catch (e) {}
    </script>

    <!-- GitHub Pages SPA redirect (pairs with public/404.html): restores deep links like /admin/leads -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&') })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
