name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fail if the Neon URL was missing
        run: |
          if [ -z "${{ secrets.VITE_NEON_URL }}" ]; then
            echo "::error::Add the VITE_NEON_URL repository secret (see README)."
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          # Repository secret: Settings -> Secrets and variables -> Actions
          VITE_NEON_URL: ${{ secrets.VITE_NEON_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
